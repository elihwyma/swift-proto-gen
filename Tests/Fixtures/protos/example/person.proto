syntax = "proto3";

package example;

import "example/common.proto";
import "google/protobuf/timestamp.proto";

message Person {
  message Address {
    string street_line = 1;
    string postal_code = 2;
  }

  string full_name = 1;
  int32 id = 2;
  repeated string emails = 3;
  Status status = 4;
  Money balance = 5;
  google.protobuf.Timestamp created_at = 6;
  optional string nickname = 7;
  map<string, Address> addresses = 8;

  oneof contact {
    string phone_number = 9;
    string email_address = 10;
  }
}
